listen_addresses = '*'
port = 5433
hba_file = '/etc/postgresql/pg_hba.conf'
oauth_validator_libraries = 'vault_validator'
log_connections = 'authentication,authorization'

vault_validator.issuer = 'http://localhost:8080/realms/vault'
vault_validator.introspect_url = 'http://localhost:8080/realms/vault/protocol/openid-connect/token/introspect'
vault_validator.client_id = 'vault-db'
vault_validator.client_secret = 'vault-db-spike-secret'
vault_validator.audience = 'vault-db'
vault_validator.login_claim = 'vault_login'
