# Local socket inside the container: administration.
local   all       postgres                  trust
local   all       all                       trust
# Break-glass password login for the administrator.
host    all       postgres   0.0.0.0/0      scram-sha-256
host    all       postgres   ::/0           scram-sha-256
# Password sign-in: platform administrators, and members of organizations that
# still use passwords (Manager adds them to vault_password_sign_in).
host    all       /_platform$,+vault_password_sign_in   0.0.0.0/0   scram-sha-256
host    all       /_platform$,+vault_password_sign_in   ::/0        scram-sha-256
# Everyone else signs in with a Keycloak token.
host    all       all        0.0.0.0/0      oauth issuer="http://localhost:8080/realms/vault" scope="openid" validator=vault_validator delegate_ident_mapping=1
host    all       all        ::/0           oauth issuer="http://localhost:8080/realms/vault" scope="openid" validator=vault_validator delegate_ident_mapping=1
