site_name: ScheduleIO Documentation
site_description: Cross-platform Qt/C++ library for reading, editing, scheduling, and writing Microsoft Project files.
site_url: https://kestermckinney.github.io/ScheduleIO/
repo_url: https://github.com/kestermckinney/ScheduleIO
repo_name: kestermckinney/ScheduleIO
edit_uri: edit/main/docs/

theme:
  name: readthedocs
  highlightjs: true

extra_css:
  - stylesheets/extra.css

nav:
  - 'Home': index.md
  - 'Getting Started':
    - 'Building': GettingStarted/Building.md
    - 'Basic Usage': GettingStarted/BasicUsage.md
    - 'Editing and Scheduling': GettingStarted/EditingAndScheduling.md
    - 'XML Interchange': GettingStarted/XmlInterchange.md
    - 'Dynamic Loading': GettingStarted/DynamicLoading.md
  - 'API Reference':
    - 'MppIO Class': API/MppIO.md
    - 'XmlIO Class': API/XmlIO.md
    - 'Scheduling Utilities': API/Scheduling.md
    - 'Project Reconciliation': API/Reconciliation.md
  - 'Data Model':
    - 'Overview': DataModel/Overview.md
    - 'Project': DataModel/Project.md
    - 'Task': DataModel/Task.md
    - 'Resource': DataModel/Resource.md
    - 'Assignment': DataModel/Assignment.md
    - 'Relation': DataModel/Relation.md
    - 'Calendar': DataModel/Calendar.md
    - 'Baseline': DataModel/Baseline.md
    - 'Availability': DataModel/Availability.md
    - 'CustomField': DataModel/CustomField.md
    - 'CostRate': DataModel/CostRate.md
    - 'Time-phased Values': DataModel/TimephasedValue.md
    - 'Duration and Units': DataModel/Duration.md
    - 'View and Timeline Formatting': DataModel/Formatting.md
    - 'Scheduling Helper Types': DataModel/SchedulingTypes.md
  - 'Reference':
    - 'Field Coverage': Reference/FieldCoverage.md
    - 'MPP File Format and Storage': Reference/FileFormat.md
  - 'Contributing': Contributing.md

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - def_list
  - fenced_code
